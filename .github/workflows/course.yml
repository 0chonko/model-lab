name: Course labs

on: [push, pull_request]

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "torch>=2.6" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-course.txt
      - run: python -m pytest -q
